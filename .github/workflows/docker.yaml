## Builds the tidymodels image for the two r2u suites that ship arm64 binaries:
## noble (24.04) and resolute (26.04). See https://eddelbuettel.github.io/r2u/vignettes/FAQ/
##
## Each arch is built on a native runner and the results are joined into one multi-arch
## manifest. Native runners are used rather than QEMU because the image installs on the
## order of a hundred apt packages, which is slow to emulate.
##
## The upstream base contexts (noble/, resolute/, noble_ci/) build rocker/r2u:* and are
## not built here; they are carried only to keep merges from rocker-org/r2u clean.

name: docker

on:
  workflow_dispatch:
  schedule:
  - cron: "33 4 3 * *"

env:
  IMAGE: docker.io/jsperger/r-r2u-tidymodels

jobs:
  build:
    runs-on: ${{ matrix.config.runs }}
    name: '${{ matrix.config.ver }} ${{ matrix.config.arch }}'
    strategy:
      fail-fast: false
      matrix:
        config:
        - { ver: '24.04', suite: 'noble',    arch: 'amd64', runs: 'ubuntu-24.04' }
        - { ver: '24.04', suite: 'noble',    arch: 'arm64', runs: 'ubuntu-24.04-arm' }
        - { ver: '26.04', suite: 'resolute', arch: 'amd64', runs: 'ubuntu-24.04' }
        - { ver: '26.04', suite: 'resolute', arch: 'arm64', runs: 'ubuntu-24.04-arm' }
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        no-cache: true
        platforms: linux/${{ matrix.config.arch }}
        context: tidymodels
        build-args: R2U_SUITE=${{ matrix.config.suite }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        touch "/tmp/digests/${{ steps.build.outputs.digest }}"
    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.config.suite }}-${{ matrix.config.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: 'manifest ${{ matrix.config.ver }}'
    strategy:
      fail-fast: false
      matrix:
        config:
        - { ver: '24.04', suite: 'noble',    tags: '-t $IMAGE:noble -t $IMAGE:24.04 -t $IMAGE:latest' }
        - { ver: '26.04', suite: 'resolute', tags: '-t $IMAGE:resolute -t $IMAGE:26.04' }
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        pattern: digests-${{ matrix.config.suite }}-*
        merge-multiple: true
        path: /tmp/digests
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create ${{ matrix.config.tags }} \
          $(printf "$IMAGE@sha256:%s " *)
    - name: Inspect
      run: docker buildx imagetools inspect "$IMAGE:${{ matrix.config.suite }}"
